</div>

<script>
(() => {
  const DURATION = 5.0;             // detik, sama dengan video
  const LOOP = false;               // Tahan di frame akhir sampai aplikasi siap
  const q = new URLSearchParams(location.search);
  const FREEZE = q.has('t') ? parseFloat(q.get('t')) : null;

  // ---- tabel keyframe hasil ukur dari video (t detik, nilai) ----
  const T = {
    logoOp : [[.30,0],[.35,.03],[.40,.04],[.45,.12],[.50,.16],[.55,.28],[.60,.34],[.65,.46],[.70,.52],[.75,.65],[.80,.70],[.85,.79],[.90,.84],[.95,.91],[1.0,.92],[1.05,.97],[1.1,.99],[1.2,1]],
    logoSc : [[.30,.90],[.50,.945],[.80,.99],[1.1,1]],
    arcOp  : [[.52,.30],[.70,.49],[.80,.63],[.90,.77],[1.0,.83],[1.1,.89],[1.2,.93],[1.3,.94],[1.4,.96],[1.5,.99],[1.8,1]],
    arc1   : [[0.52, 1.9], [0.55, 93.6], [0.6, 326.0], [0.65, 429.2], [0.7, 478.8], [0.75, 566.3], [0.8, 608.2], [0.85, 680.6], [0.9, 714.9], [0.95, 760.8], [1.25, 1558.4]],
    arc2   : [[0.52, 1.9], [0.6, 325.8], [0.65, 430.6], [0.7, 478.3], [0.75, 568.1], [0.8, 608.2], [0.85, 682.4], [0.9, 714.6], [0.95, 759.8], [1.25, 1536.9]],
    txtOp  : [[1.22,0],[1.30,.43],[1.40,.65],[1.50,.81],[1.60,.91],[1.70,.96],[1.80,.99],[1.90,1]],
    ulW    : [[1.75,0],[1.80,48],[1.85,66],[1.90,76],[1.95,92],[2.00,96],[2.05,108],[2.10,110],[2.15,116],[2.25,120]],
    ulOp   : [[1.75,0],[1.80,.55],[1.90,.82],[2.00,1]],
    shineX : [[1.40,470],[1.55,520],[1.70,560],[1.80,590],[1.90,625],[2.00,665],[2.10,725],[2.20,775],[2.30,805],[2.45,860]],
    shineOp: [[1.40,0],[1.50,1],[2.35,1],[2.45,0]],
    fill   : [[2.0,0],[2.5,.15],[3.2,.55],[3.8,.85],[4.25,1]],
    out    : [[4.30,1],[5.00,0]]
  };
  const SPACE_FROM = 29, SPACE_TO = 6, SPACE_T0 = 1.22, SPACE_DUR = .65;

  const lerp = (tab, t) => {
    if (t <= tab[0][0]) return tab[0][1];
    for (let i = 1; i < tab.length; i++) {
      if (t <= tab[i][0]) {
        const [a, av] = tab[i-1], [b, bv] = tab[i];
        return av + (bv - av) * (t - a) / (b - a);
      }
    }
    return tab[tab.length-1][1];
  };
  const easeOut = x => 1 - Math.pow(1 - Math.min(Math.max(x,0),1), 3);

  const $ = id => document.getElementById(id);
  const stage = $('stage'), fade = $('fade'), logo = $('logo'), shine = $('shine'),
        word = $('word'), ul = $('ul'), fill = $('fill'), arc1 = $('arc1'), arc2 = $('arc2');
  const L1 = arc1.getTotalLength(), L2 = arc2.getTotalLength();
  arc1.style.strokeDasharray = L1 + ' ' + L1;
  arc2.style.strokeDasharray = L2 + ' ' + L2;

  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    stage.style.transform = `scale(${s}) translate(-640px,-360px)`;
  }
  addEventListener('resize', fit); fit();

  function render(t) {
    fade.style.opacity = lerp(T.out, t);

    // arcs: digambar + fade-in
    const a1 = t < .52 ? 0 : lerp(T.arc1, t), a2 = t < .52 ? 0 : lerp(T.arc2, t);
    arc1.style.strokeDashoffset = L1 - a1;
    arc2.style.strokeDashoffset = L2 - a2;
    const ao = t < .52 ? 0 : lerp(T.arcOp, t);
    arc1.style.opacity = a1 > 0 ? ao : 0; arc2.style.opacity = a2 > 0 ? ao : 0;

    // logo
    logo.style.opacity = lerp(T.logoOp, t);
    logo.style.transform = `scale(${lerp(T.logoSc, t)})`;
    const S = window.SHINE || {skew:18, w:140, dx:0, pk:.5};
    const sx = lerp(T.shineX, t) - 488 + S.dx;
    shine.style.width = S.w + 'px'; shine.style.left = (-S.w/2) + 'px';
    shine.style.background = `linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,${S.pk*.35}) 25%, rgba(255,255,255,${S.pk}) 50%, rgba(255,255,255,${S.pk*.35}) 75%, rgba(255,255,255,0) 100%)`;
    shine.style.opacity = lerp(T.shineOp, t);
    shine.style.transform = `translateX(${sx}px) skewX(${-S.skew}deg)`;

    // teks NORYX
    const p = easeOut((t - SPACE_T0) / SPACE_DUR);
    const ls = SPACE_FROM + (SPACE_TO - SPACE_FROM) * p;
    word.style.opacity = lerp(T.txtOp, t);
    word.style.letterSpacing = ls + 'px';
    word.style.paddingLeft = ls + 'px';          // kompensasi spasi di huruf terakhir

    // underline
    ul.style.opacity = lerp(T.ulOp, t);
    ul.style.transform = `scaleX(${lerp(T.ulW, t) / 120})`;

    // bar loading: terisi dari kiri ke kanan (atau ikut progres asli lewat window.setProgress)
    const prog = (typeof window.__progress === 'number') ? window.__progress : lerp(T.fill, t);
    fill.style.transform = `scaleX(${Math.min(Math.max(prog,0),1)})`;
  }

  if (FREEZE !== null) { render(FREEZE); }
  else {
    const t0 = performance.now();
    let done = false;
    const loop = now => {
      let t = (now - t0) / 1000;
      if (LOOP) t = t % DURATION; else if (t >= DURATION) { t = DURATION; done = true; }
      render(t);
      if (!done) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  window.__render = render;
  // Progres asli: window.setProgress(0..1) menggantikan animasi isi bar
  window.setProgress = p => { window.__progress = p; };
  // Pakai: window.hideLoader() saat halaman siap
  window.hideLoader = () => { const el = $('loader'); el.style.transition='opacity .4s'; el.style.opacity=0; setTimeout(()=>el.remove(),450); };
})();
</script>
